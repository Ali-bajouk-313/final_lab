<p class="total-users">
    Total users: {{users().length}}
</p>


<div class="users-actions">

<input

class="search-input"

placeholder="Search users..."


/>






@if(showform()){


<div class="user-form">


<h2>

{{selectedUser().id ? 
'Edit User' :
'Add User'}}

</h2>



<div class="form-group">

<label>
Username
</label>

<input

placeholder="Username"

[(ngModel)]="selectedUser().username"

/>

</div>




<div class="form-group">

<label>
Email
</label>

<input

type="email"

placeholder="Email"

[(ngModel)]="selectedUser().email"

/>

</div>




<div class="form-group">

</div>




<div class="form-group">

<label>
Role
</label>


<select

[(ngModel)]="selectedUser().role">


<option value="user">
User
</option>


<option value="admin">
Admin
</option>


</select>


</div>




<h3>
Address
</h3>



<div class="address-grid">


<div class="form-group">

<label>
Street
</label>


<input

placeholder="Street"

[(ngModel)]="selectedUser().addresses[0].street"

/>

</div>




<div class="form-group">

<label>
City
</label>


<input

placeholder="City"

[(ngModel)]="selectedUser().addresses[0].city"

/>

</div>




<div class="form-group">

<label>
Country
</label>


<input

placeholder="Country"

[(ngModel)]="selectedUser().addresses[0].country"

/>

</div>




<div class="form-group">

<label>
Phone
</label>


<input

placeholder="Phone"

[(ngModel)]="selectedUser().addresses[0].phone"

/>

</div>


</div>



<div class="form-buttons">


<button

class="save-btn"

(click)="saveUser()">

Save

</button>



<button

class="cancel-btn"

(click)="closeForm()">

Cancel

</button>


</div>



</div>


}




<ag-grid-angular

class="ag-theme-alpine"

[rowData]="users()"

[columnDefs]="columnDefs"

domLayout="autoHeight">

</ag-grid-angular>
