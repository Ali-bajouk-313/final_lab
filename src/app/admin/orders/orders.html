<p class="total-orders">
    Total Orders: {{orders().length}}
</p>



@if(showform()){


<div class="order-form">


<h2>
Edit Order
</h2>



<label>
Status
</label>


<select [(ngModel)]="selectedOrder().status">

<option>
Pending
</option>

<option>
Processing
</option>

<option>
Shipped
</option>

<option>
Delivered
</option>

</select>




<h3>
Shipping Address
</h3>



<input
placeholder="Address"
[(ngModel)]="selectedOrder().shipping.address"
>



<input
placeholder="City"
[(ngModel)]="selectedOrder().shipping.city"
>



<input
placeholder="Country"
[(ngModel)]="selectedOrder().shipping.country"
>



<input
placeholder="Phone"
[(ngModel)]="selectedOrder().shipping.phone"
>



<div class="buttons">


<button
class="save-btn"
(click)="saveOrder()">
Save
</button>


<button
class="cancel-btn"
(click)="closeForm()">
Cancel
</button>


</div>


</div>


}




<ag-grid-angular

class="ag-theme-alpine"

[rowData]="orders()"

[columnDefs]="columnDefs"

domLayout="autoHeight">

</ag-grid-angular>
