<div class="dashboard">

    <h1>Overview</h1>

    <div class="cards">

        <div class="card">
            <div class="card-header">
                <span>Total Revenue</span>
                <i class="fa-solid fa-dollar-sign"></i>
            </div>

            <h2>${{ totalRevenue() }}</h2>

            <small>Store Revenue</small>
        </div>


        <div class="card">
            <div class="card-header">
                <span>Total Orders</span>
                <i class="fa-solid fa-box"></i>
            </div>

            <h2>{{ totalOrders() }}</h2>

            <small>Orders Received</small>
        </div>


        <div class="card">
            <div class="card-header">
                <span>Products</span>
                <i class="fa-solid fa-cube"></i>
            </div>

            <h2>{{ totalProducts() }}</h2>

            <small>Products Available</small>
        </div>


        <div class="card">
            <div class="card-header">
                <span>Users</span>
                <i class="fa-solid fa-users"></i>
            </div>

            <h2>{{ totalUsers() }}</h2>

            <small>Registered Users</small>
        </div>


        <div class="card">
            <div class="card-header">
                <span>Pending Orders</span>
                <i class="fa-solid fa-clock"></i>
            </div>

            <h2>{{ pendingOrders() }}</h2>

            <small>Waiting for Processing</small>
        </div>

    </div>

</div>
