<div class="favorites-container">


<div class="click">
    <h1>Your favorites</h1>

    <button
        (click)="clear()">
        Clear favorites
    </button>
</div>
    @if(favorites().length === 0){

        <p>Lets go Shopping</p>
        <button>
            Go Shopping
        </button>
        <p>
            Your favorites is empty.
        </p>

    }
    @else {


    @for(item of favorites(); track item.id){

    <div class="favorites-item">

    <img 
    [src]="item.image"
    [alt]="item.title">


    <div>
        <h3>
        {{item.title}}
        </h3>
        <p>
        Price: ${{item.price}}
        </p>

    </div>
    <div class="actions">
    <button
        class="remove-heart"
        (click)="remove(item.id)">
        <lucide-icon
            [img]="Heart"
            (click)="remove(item.id)">
        </lucide-icon>
    </button>
     <button 
        class="cart-btn"
        (click)="addToCart(item)">
        Add To Cart
    </button>
    </div>

    
    </div>

    }



    }
   


</div>
